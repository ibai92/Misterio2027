<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar asistencia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="caja">
    <a class="logo" href="/">Sandra &amp; David</a>
    <nav>
      <a href="/">Invitación</a>
      <a href="/actividades">Actividades</a>
      <a href="/informacion">Información</a>
      <a class="cta" href="/asistencia">Confirmar asistencia</a>
      <a href="/panel" id="adminlink" hidden>Administración</a>
      <button class="sec" id="salir">Cerrar sesión</button>
    </nav>
  </div></header>
  <main class="caja centro asistencia">
    <span class="script">Sandra y David te esperan</span>
    <h1>¿Vienes a celebrarlo con nosotros?</h1>
    <p>Nos haría muy felices compartir este día contigo. Solo nos falta saber si vendrás.</p>
    <button class="gigante" id="si" type="button"><span aria-hidden="true">✨</span> <span id="texto">¡Confirmar asistencia!</span> <span aria-hidden="true">✨</span></button>
    <button class="pequeno" id="no" type="button">No puedo asistir</button>
    <p id="estado" class="estado" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const TXT = {
      si: 'Qué ilusión. Ya estás en la lista: te esperamos con los brazos abiertos. 💛',
      no: 'Te echaremos mucho de menos. Si cambias de idea, aquí seguiremos esperándote. 💌'
    };
    function pinta(e) {
      $('estado').textContent = e ? TXT[e] : '';
      $('si').classList.toggle('hecho', e === 'si');
      $('texto').textContent = e === 'si' ? '¡Asistencia confirmada!' : '¡Confirmar asistencia!';
    }
    async function enviar(e) {
      try { await api('rsvp', { estado: e }); pinta(e); if (e === 'si') confeti(); }
      catch (err) { aviso($('estado'), err.message, true); }
    }
    function confeti() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const c = document.createElement('canvas');
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none';
      c.width = innerWidth; c.height = innerHeight; document.body.append(c);
      const x = c.getContext('2d'), r = $('si').getBoundingClientRect();
      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
      const col = ['#e0558a', '#d6b36a', '#a9d3e8', '#b9d1a6', '#c9b6e6', '#f3d58a', '#ffffff'];
      const p = Array.from({ length: 170 }, () => {
        const a = Math.random() * 6.283, v = 4 + Math.random() * 10;
        return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: Math.random() * 6.283,
                 w: 5 + Math.random() * 8, c: col[Math.random() * 7 | 0], h: Math.random() < .35 };
      });
      let t = 0; x.font = '20px sans-serif';
      (function f() {
        x.clearRect(0, 0, c.width, c.height); t++;
        p.forEach(q => {
          q.vy += .22; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += .15;
          x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillStyle = q.c; x.globalAlpha = Math.max(0, 1 - t / 170);
          q.h ? x.fillText('♥', 0, 0) : x.fillRect(-q.w / 2, -q.w / 4, q.w, q.w / 2);
          x.restore();
        });
        t < 180 ? requestAnimationFrame(f) : c.remove();
      })();
    }
    $('si').onclick = () => enviar('si');
    $('no').onclick = () => enviar('no');
    iniciar().then(async yo => { if (yo) { const r = await api('rsvp').catch(() => ({})); pinta(r.estado); } });
  </script>
</body>
</html>
