<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una invitación te espera</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="noche">
  <div class="luna"></div>
  <main>
    <div class="puerta">
      <div class="candado" id="candado">
        <div class="arco"></div>
        <div class="cuerpo-c">
          <div class="ruedas" role="group" aria-label="Número secreto de 4 cifras">
            <div class="rueda" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-label="Cifra 1"><div class="tira"></div></div>
            <div class="rueda" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-label="Cifra 2"><div class="tira"></div></div>
            <div class="rueda" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-label="Cifra 3"><div class="tira"></div></div>
            <div class="rueda" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-label="Cifra 4"><div class="tira"></div></div>
          </div>
        </div>
      </div>
      <h1>Una invitación te espera</h1>
      <p>Gira las ruedas del candado hasta formar tu número secreto.</p>
      <button id="abrir" type="button">Abrir el candado</button>
      <p id="msg" class="msg" role="status"></p>
    </div>
  </main>
  <script src="/app.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const ruedas = [...document.querySelectorAll('.rueda')];
    ruedas.forEach(r => {
      const tira = r.firstElementChild; let pos = 10, y0 = null, pasos = 0, t = 0;
      for (let i = 0; i < 40; i++) { const d = document.createElement('div'); d.textContent = i % 10; tira.append(d); }
      const aplica = anim => {
        tira.style.transition = anim ? 'transform .28s cubic-bezier(.3,1.5,.5,1)' : 'none';
        tira.style.transform = 'translateY(calc(var(--h) * ' + (.3 - pos) + '))';
        r.dataset.v = pos % 10; r.setAttribute('aria-valuenow', pos % 10);
      };
      const mover = d => {
        if (pos + d < 3 || pos + d > 36) { pos += pos + d < 3 ? 20 : -20; aplica(false); void tira.offsetWidth; }
        pos += d; aplica(true);
      };
      aplica(false);
      r.addEventListener('pointerdown', e => { y0 = e.clientY; pasos = 0; if (r.setPointerCapture) r.setPointerCapture(e.pointerId); });
      r.addEventListener('pointermove', e => {
        if (y0 === null) return; const dy = y0 - e.clientY;
        if (Math.abs(dy) >= 26) { mover(dy > 0 ? 1 : -1); y0 = e.clientY; pasos++; }
      });
      r.addEventListener('pointerup', () => { if (y0 !== null && pasos === 0) mover(1); y0 = null; });
      r.addEventListener('pointercancel', () => { y0 = null; });
      r.addEventListener('wheel', e => { e.preventDefault(); const n = Date.now(); if (n - t > 120) { t = n; mover(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
      r.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') { e.preventDefault(); mover(1); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); mover(-1); }
        else if (/^[0-9]$/.test(e.key)) mover((+e.key - pos % 10 + 10) % 10);
        else if (e.key === 'Enter') abrir();
      });
    });
    async function abrir() {
      const pin = ruedas.map(r => r.dataset.v).join('');
      try {
        await api('login', { pin });
        $('candado').classList.add('abierto'); aviso($('msg'), '¡Bienvenido!');
        setTimeout(() => { location.href = '/'; }, 900);
      } catch (err) {
        const c = $('candado'); c.classList.remove('sacude'); void c.offsetWidth; c.classList.add('sacude');
        aviso($('msg'), err.message, true);
      }
    }
    $('abrir').onclick = abrir;
  </script>
</body>
</html>
